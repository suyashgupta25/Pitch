build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 160
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 10
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: true
    threshold: 22

style:
  active: true
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 4
  WildcardImport:
    active: false
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true
  UnusedParameter:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
  LoopWithTooManyJumpStatements:
    active: false

formatting:
  active: true
  android: true
  autoCorrect: false
  Indentation:
    active: false
  MaximumLineLength:
    active: false
  NoWildcardImports:
    active: false
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
  Filename:
    active: false

naming:
  active: true
  TopLevelPropertyNaming:
    active: false
  FunctionNaming:
    active: false
  MatchingDeclarationName:
    active: false

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: false

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

potential-bugs:
  active: true

performance:
  active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
